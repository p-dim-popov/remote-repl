name: Verify

# The verification module (ADR 0006). This is the ONLY place the recipe
# exists: pr.yml calls it on every pull request, release.yml calls it on every
# push to main and publishes only behind it. Two suites, two jobs, two
# questions, no Redis anywhere:
#  - dev:     the contributor's laptop in CI (Node from mise.toml). Typecheck,
#             schema check, build and `npm test`: the unit + integration
#             suite, nothing skips, no Docker.
#             "Does `npm test` pass on the dev Node?"
#  - runtime: every supported runtime. Build, then `npm run test:runtime`:
#             the consumer apps under runtime-tests/* against the built dist/.
#             "Can an app on this runtime use what we ship?" All legs block.

on:
  workflow_call:

jobs:
  dev:
    name: dev (mise node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

      - name: Protocol schema drift check
        # Regenerates packages/core/schema/protocol.schema.json from the
        # TypeScript protocol types and fails if the committed file differs.
        run: npm run schema:check

      - name: Build
        run: npm run build

      - name: Test (unit + integration, zero skips)
        run: npm test

  runtime:
    name: runtime (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node legs pick their version per command with `mise x` (even the
          # one matching mise.toml, so the leg name stays true when the dev
          # Node moves on); Bun and Deno come from mise.toml. `npm ci` ran
          # once on the dev Node: the native binaries are per platform, not
          # per Node version.
          - runtime: node-22
            vitest: mise x node@22 -- npx vitest run
          - runtime: node-24
            vitest: mise x node@24 -- npx vitest run
          - runtime: node-26
            vitest: mise x node@26 -- npx vitest run
          # `--bun` is REQUIRED: without it bunx honours vitest's node shebang
          # and the whole leg silently runs on Node.
          - runtime: bun
            vitest: bun --bun x vitest run
          # The default forks pool exits 1 with "Uncaught BrokenPipe" on Deno
          # after a fully green run; the threads pool exits cleanly.
          - runtime: deno
            vitest: deno run -A npm:vitest run --pool=threads
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The runtime suite resolves the packages' built dist/, so build first.
      - name: Build
        run: npm run build

      - name: Runtime suite (runtime-tests/* against dist/)
        run: npm run test:runtime -- ${{ matrix.vitest }}
